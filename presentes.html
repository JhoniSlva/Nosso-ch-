<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Escolha um Presente</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="presentes.css">
</head>
<body>

  <div class="background"></div>

  <div class="noise"></div>

  <div class="blur blur1"></div>
  <div class="blur blur2"></div>

  <section class="hero">

    <div class="hero-overlay"></div>

    <div class="hero-content">

      <p class="mini">
        ✨ Nosso novo lar ✨
      </p>

      <h1 id="tituloNome">
        Olá!
      </h1>

      <p class="hero-text">
        Cada presente fará parte
        da história do nosso novo começo.
      </p>

    </div>

  </section>


  <section class="products-section">

    <div class="top-text">

      <h2>
        Escolha um presente especial 💙
      </h2>

      <p>
        Selecionamos com carinho itens
        importantes para o nosso novo lar.
      </p>

    </div>


    <div class="confirm-area">

      <div class="confirm-card active" data-value="true">
        💙 Sim, estarei presente
      </div>

      <div class="confirm-card" data-value="false">
        😢 Não poderei comparecer
      </div>

    </div>


    <div class="masonry-grid" id="grid"></div>


    <button id="confirmarBtn">
      Confirmar Presença
    </button>

  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <script src="presentes.js"></script>

</body>
</html>
