<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chá de Casa Nova | Jhoni & Verônica</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="background"></div>

  <div class="light light1"></div>
  <div class="light light2"></div>

  <div class="particles"></div>

  <section class="container">

    <!-- ESQUERDA -->

    <div class="left-side">

      <div class="overlay"></div>

    <img
  class="flower flower1"
  src="https://pngimg.com/d/flowers_PNG102.png"
>

<img
  class="flower flower2"
  src="https://pngimg.com/d/flowers_PNG103.png"
>

<div class="blur-circle blur1"></div>
<div class="blur-circle blur2"></div>
<div class="blur-circle blur3"></div>

<div class="noise"></div>
      <div class="content">

        <p class="mini-title">
          ✨ Convite Especial ✨
        </p>

        <div class="line"></div>

        <h1>
          Chá de Casa Nova
        </h1>

        <h2>
          Jhoni & Verônica
        </h2>

        <p class="description">
          Nosso novo lar começa com amor,
          sonhos e pessoas especiais ao nosso lado.
          E seria impossível viver esse momento
          sem compartilhar com você.
        </p>

      </div>

    </div>


    <!-- DIREITA -->

    <div class="right-side">

      <div class="form-box">

        <p class="small-text">
          Estamos muito felizes
          em ter você conosco 💙
        </p>

        <h3>
          Confirme sua presença
        </h3>

        <input
          type="text"
          placeholder="Digite seu nome"
          id="nome"
        >

        <button id="entrarBtn">
          Abrir Convite
        </button>

      </div>

    </div>

  </section>

  <script src="script.js"></script>

</body>
</html>
