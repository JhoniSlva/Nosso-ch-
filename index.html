<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chá de Casa Nova | Jhoni & Verônica</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg"></div>

  <div class="particles"></div>

  <section class="hero" id="homeScreen">

    <div class="hero-content">

      <p class="mini-title">
        ✨ Convite Especial ✨
      </p>

      <h1>
        Um novo lar.
        <span>Um novo começo.</span>
      </h1>

      <div class="line"></div>

      <h2>
        Chá de Casa Nova
        <span>Jhoni & Verônica</span>
      </h2>

      <p class="description">
        Estamos construindo nosso cantinho com muito amor
        e gostaríamos de compartilhar esse momento especial
        com você.
      </p>

      <div class="invite-box">

        <input
          type="text"
          id="nome"
          placeholder="Digite seu nome"
        >

        <button id="entrarBtn">
          Entrar no Convite
        </button>

      </div>

      <div class="heart">
        💙
      </div>

    </div>

  </section>

  <script src="script.js"></script>

</body>
</html>
