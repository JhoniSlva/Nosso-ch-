<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chá de Casa Nova | Jhoni & Verônica</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-image"></div>

  <div class="overlay"></div>

  <div class="particles"></div>

  <div class="mouse-light"></div>

  <img
    class="flower flower1"
    src="https://pngimg.com/d/flowers_PNG103.png"
  >

  <img
    class="flower flower2"
    src="https://pngimg.com/d/flowers_PNG98.png"
  >

  <section class="hero">

    <div class="content">

      <p class="mini-title">
        ✨ Um momento especial ✨
      </p>

      <div class="line"></div>

      <h1>
        Chá de Casa Nova
      </h1>

      <h2>
        Jhoni & Verônica
      </h2>

      <p class="description">
        Um novo lar está começando a ganhar vida.

Entre sonhos, amor e novos caminhos,
estamos construindo o nosso cantinho
e gostaríamos muito de compartilhar
esse momento tão especial com você.

Sua presença fará parte dessa memória para sempre.
      </p>

      <div class="invite-actions">

        <input
          type="text"
          id="nome"
          placeholder="Digite seu nome"
        >

        <button id="entrarBtn">
          Abrir Convite
        </button>

      </div>

    </div>

  </section>

  <script src="script.js"></script>

</body>
</html>
