<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chá de Casa Nova | Jhoni & Verônica</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="mouse-light"></div>

  <section class="container">

    <!-- ESQUERDA -->

    <div class="left-side">

      <div class="image-layer"></div>

      <div class="overlay"></div>

      <div class="particles"></div>

      <img
        class="flower flower1"
        src="https://pngimg.com/d/flowers_PNG103.png"
      >

      <img
        class="flower flower2"
        src="https://pngimg.com/d/flowers_PNG98.png"
      >

      <div class="content">

        <p class="mini-title">
          ✨ Um momento especial ✨
        </p>

        <div class="line"></div>

        <h1>
          Chá de Casa Nova
        </h1>

        <h2>
          Jhoni & Verônica
        </h2>

        <p class="description">
          Nosso lar começa com sonhos,
          carinho e pessoas especiais ao nosso lado.
          E gostaríamos muito de compartilhar
          esse momento com você.
        </p>

      </div>

    </div>


    <!-- DIREITA -->

    <div class="right-side">

      <div class="glass-panel">

        <p class="small-text">
          Estamos felizes em ter você conosco 💙
        </p>

        <h3>
          Confirme sua presença
        </h3>

        <input
          type="text"
          id="nome"
          placeholder="Digite seu nome"
        >

        <button id="entrarBtn">
          Abrir Convite
        </button>

      </div>

    </div>

  </section>

  <script src="script.js"></script>

</body>
</html>
