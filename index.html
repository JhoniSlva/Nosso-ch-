<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chá de Casa Nova | Jhoni & Verônica</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="background"></div>

  <div class="light light1"></div>
  <div class="light light2"></div>

  <div class="particles"></div>

  <img class="flower flower-left" src="https://images.unsplash.com/photo-1520763185298-1b434c919102?q=80&w=1200&auto=format&fit=crop">

  <img class="flower flower-right" src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?q=80&w=1200&auto=format&fit=crop">

  <section class="hero">

    <div class="invite">

      <p class="mini-title">
        ✨ Convite Especial ✨
      </p>

      <div class="line"></div>

      <h1>
        Chá de Casa Nova
      </h1>

      <h2>
        Jhoni & Verônica
      </h2>

      <p class="text">
        Nosso lar está começando a ganhar vida,
        e não poderíamos viver esse momento
        sem pessoas especiais como você.
      </p>

      <div class="input-area">

        <input
          type="text"
          placeholder="Digite seu nome"
          id="nome"
        >

        <button id="entrarBtn">
          Abrir Convite
        </button>

      </div>

      <div class="heart">
        💙
      </div>

    </div>

  </section>

  <script src="script.js"></script>

</body>
</html>
